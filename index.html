<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flashcards</title>
        <link rel="stylesheet" href="stylesheet.css">
    </head>
    <body>
        <div class="main-container">
            <div class="carousel-section">
                <div class="carousel-container">
                    <div class="carousel-track">
                    </div>
                </div>
            </div>

            <div class="controls-section">
                <div class="nav-controls">
                    <button class="nav-arrow up">
                        <img src="https://thypix.com/wp-content/uploads/blue-arrow-59.png" alt="Up">
                    </button>
                    <button class="nav-arrow down">
                        <img src="https://thypix.com/wp-content/uploads/blue-arrow-59.png" alt="Down">
                    </button>
                </div>

                <div class="dots">
                </div>
            </div>
        </div>

        <button id="add-card-btn">Add card</button>

        <div id="card-modal" class="hidden">
            <div class="modal-box">
                <h2>New flashcard</h2>
                <input id="input-question" type="text" placeholder="Question" />
                <input id="input-answer" type="text" placeholder="Answer" />
                <div class="modal-actions">
                    <button id="modal-cancel">Cancel</button>
                    <button id="modal-save">Save</button>
                </div>
            </div>
        </div>

        <div id="edit-modal" class="hidden">
            <div class="modal-box">
                <h2>Edit flashcard</h2>
                <input id="edit-question" type="text" placeholder="Question" />
                <input id="edit-answer" type="text" placeholder="Answer" />
                <div class="modal-actions">
                    <button id="edit-modal-cancel">Cancel</button>
                    <button id="edit-modal-save">Save</button>
                </div>
            </div>
        </div>
        
        <script src="scripts.js"></script>
    </body>
</html>
