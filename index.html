<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div class="main-container">
        <div class="carousel-section">
            <div class="carousel-container">
                <div class="carousel-track">
                    <div class="card" data-index="0">
                        <h1 class="question">What color is the sky?</h1>
                        <h1 class="answer">Blue</h1>
                    </div>
                    <div class="card" data-index="1">
                        <h1 class="question">What's 2 + 2?</h1>
                        <h1 class="answer">4</h1>
                    </div>
                    <div class="card" data-index="2">
                        <h1 class="question">How many countries in the world?</h1>
                        <h1 class="answer">195</h1>
                    </div>
                    <div class="card" data-index="3">
                        <h1 class="question">What century are we currently on?</h1>
                        <h1 class="answer">XXI</h1>
                    </div>
                    <div class="card" data-index="4">
                        <h1 class="question">How do plants get energy?</h1>
                        <h1 class="answer">Photosythensis</h1>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls-section">
            <div class="nav-controls">
                <button class="nav-arrow up">
                    <img src="https://thypix.com/wp-content/uploads/blue-arrow-59.png" alt="Up">
                </button>
                <button class="nav-arrow down">
                    <img src="https://thypix.com/wp-content/uploads/blue-arrow-59.png" alt="Down">
                </button>
            </div>

            <div class="dots">
                <div class="dot active" data-index="0"></div>
                <div class="dot" data-index="1"></div>
                <div class="dot" data-index="2"></div>
                <div class="dot" data-index="3"></div>
                <div class="dot" data-index="4"></div>
            </div>
        </div>
    </div>

<script src="scripts.js"></script>
</body>
</html>
